[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digest-agent"
version = "0.1.0"
description = "Personal Tech-Briefing Digest Agent built with Google ADK 2.0 for Cloud Run Instances"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cloud & AI Engineering Team" }
]
dependencies = [
    "google-adk>=2.0.0a1",
    "google-genai>=0.1.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.8.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["digest_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
