; ============================================================================
; PAWS/400 SANCTUARY OPERATIONS - OFFICIAL KPI & METRIC REGISTER (REV 1998-11)
; FILE: SYS_DICT_98.INI
; ============================================================================

[GLOBAL_FILTERS]
; CRITICAL: Status code 9 (`st_cd = 9`, `ent_fk = 99`) represents automated
; nightly 10kg calibration weights placed on testing benches. Never include
; `st_cd = 9` in financial, nutritional, activity, or forecasting KPIs.
ACTIVE_TELEMETRY_PREDICATE = "st_cd != 9"
VET_OBSERVATION_STATUS_CODE = 2
STANDARD_READING_STATUS_CODE = 1
CALIBRATION_SPIKE_STATUS_CODE = 9

[KPI_DAILY_CARE_SPEND_USD]
DISPLAY_NAME = Daily Care Spend (USD)
SOURCE_TABLE = petverse.pv_ops_tlm_v2
FORMULA_SQL  = SUM(care_c_usd) / 100.0
FILTER_SQL   = WHERE st_cd != 9
UNIT         = USD ($)
NOTES        = Raw `care_c_usd` is stored in integer US cents. Always divide by 100.0.

[KPI_NET_FORECASTED_FEED_DEMAND_KG]
DISPLAY_NAME = Net Forecasted Feed Demand (kg)
SOURCE_TABLE = petverse.pv_ops_tlm_v2
FORMULA_SQL  = SUM(forecast_value) / 1000.0
ENGINE       = AI.FORECAST(data_col => 'nutr_g_qty', timestamp_col => 'ts_dt', id_cols => ['ent_fk'])
FILTER_SQL   = WHERE st_cd != 9
UNIT         = Kilograms (kg)
NOTES        = Raw `nutr_g_qty` is measured in grams (g). Divide `forecast_value` sum by 1000.0 for kg.

[KPI_SUPPLY_RUNWAY_DEFICIT_KG]
DISPLAY_NAME = Supply Runway & Projected Ending Stock (kg)
SOURCE_TABLES = petverse.pv_snct_inv_88, petverse.pv_ops_tlm_v2, petverse.pets
JOIN_KEYS    = pv_ops_tlm_v2.ent_fk = pets.Id AND UPPER(pets.Species) = pv_snct_inv_88.sp_cat_cd
FORMULA_SQL  = cur_stk_kg - (SUM(forecast_value) / 1000.0)
REORDER_RULE = Reorder immediately when `cur_stk_kg - Net_Forecasted_Feed_Demand_kg < reord_thr_kg`
UNIT         = Kilograms (kg)

[KPI_HIGH_ENERGY_RESIDENT]
DISPLAY_NAME = High-Energy Resident
SOURCE_TABLE = petverse.pv_ops_tlm_v2
CLASSIFICATION_SQL = AVG(act_k_stp) > 12000
FILTER_SQL   = WHERE st_cd != 9
UNIT         = Collar steps / wheel revolutions per day
NOTES        = Residents averaging strictly above 12,000 daily `act_k_stp` qualify for high-protein rations.
