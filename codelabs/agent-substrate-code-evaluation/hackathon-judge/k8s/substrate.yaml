apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: judge-workerpool
  namespace: hackathon-judge
  labels:
    workload: hackathon-judge
spec:
  replicas: 3
  workerImage: "${SUBSTRATE_WORKER_IMAGE}"
  sandboxClasses:
  - name: gvisor
  template:
    labels:
      workload: hackathon-judge
    resources:
      # ateworker-gvisor reserves 64 MiB per worker pod from limits.memory, so
      # 4608Mi provides 512Mi (>= 64Mi) headroom above the 4Gi (4096Mi) Judge Actor limit.
      limits:
        cpu: "2000m"
        memory: "4608Mi"
      requests:
        cpu: "1000m"
        memory: "4608Mi"
