# Agent Substrate v1.0.0 ActorTemplate (protojson-shaped ateapi.ActorTemplate)
# Applied via: envsubst < k8s/actortemplate.yaml | kubectl-ate create actor-template -f -
metadata:
  name: judge-sandbox
  atespace: hackathon-judge
workerSelector:
  matchLabels:
    workload: hackathon-judge
containers:
- name: hackathon-judge
  image: "${AGENT_SANDBOX_IMAGE}"
  command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80"]
  securityContext:
    capabilities:
      add:
      - NET_BIND_SERVICE
  env:
  - name: HOME
    value: "/home/sandbox"
  - name: GOOGLE_CLOUD_PROJECT
    value: "${GOOGLE_CLOUD_PROJECT}"
  - name: GOOGLE_CLOUD_LOCATION
    value: "global"
  - name: SANDBOX_DIR
    value: "/home/sandbox/app"
  - name: MODEL_PROXY_BASE_URL
    value: "http://agent.hackathon-judge.svc.cluster.local:8000/vertex-proxy"
  - name: VERTEX_PROXY_URL
    value: "http://agent.hackathon-judge.svc.cluster.local:8000/vertex-proxy"
  - name: JUDGE_MODEL
    value: ""
  - name: SSL_CERT_FILE
    value: "/run/ate/trust-bundle.pem"
  - name: REQUESTS_CA_BUNDLE
    value: "/run/ate/trust-bundle.pem"
  - name: CURL_CA_BUNDLE
    value: "/run/ate/trust-bundle.pem"
  - name: GIT_SSL_CAINFO
    value: "/run/ate/trust-bundle.pem"
  - name: NODE_EXTRA_CA_CERTS
    value: "/run/ate/trust-bundle.pem"
  volumeMounts:
  - name: system-info
    mountPath: /run/ate
  wakeupProbe:
    httpGet:
      path: /health
      port: 80
volumes:
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        - system-roots.ate.dev
        path: trust-bundle.pem
resources:
  limits:
    cpuMillicores: 2000
    memoryBytes: 4294967296
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
