apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: hackathon-judge
  labels:
    app: agent
spec:
  selector:
    app: agent
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: model-proxy
    port: 8082
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: hackathon-judge
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: hackathon-judge-sa
      containers:
      - name: agent
        image: "${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REPO_NAME}/agent:$COMMIT_SHA"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: GOOGLE_CLOUD_PROJECT
        - name: GOOGLE_CLOUD_LOCATION
          value: "global"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "True"
        - name: TASKS_SUBSCRIPTION
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: TASKS_SUBSCRIPTION
        - name: RESULTS_TOPIC
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: RESULTS_TOPIC
        - name: SANDBOX_TEMPLATE
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: SANDBOX_TEMPLATE
              optional: true
        - name: SANDBOX_WARMPOOL
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: SANDBOX_WARMPOOL
        - name: SANDBOX_CONNECTION_METHOD
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: SANDBOX_CONNECTION_METHOD
        - name: SANDBOX_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: SANDBOX_NAMESPACE
        - name: SUBSTRATE_API_ENDPOINT
          value: "api.ate-system.svc:443"
        - name: USE_MOCK_PUBSUB
          value: "false"
        - name: AGENT_TYPE
          valueFrom:
            configMapKeyRef:
              name: hackathon-judge-config
              key: AGENT_TYPE
              optional: true
        volumeMounts:
        - name: router-client
          mountPath: /run/router-client
          readOnly: true
      volumes:
      - name: router-client
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 3600
              path: ate-api-token
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
