[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
    "google-antigravity~=0.1.23",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
