version: 2

# DATA QUALITY & GOVERNANCE SUITE FOR LLM-POWERED PIPELINES
# -----------------------------------------------------------
# LLM outputs are inherently non-deterministic. Incorporating dbt data quality tests
# on AI-generated fields (such as accepted_values and not_null) creates a reliable
# safety harness. If an LLM hallucinated an invalid category or returned a null string,
# dbt test fails early before unvalidated data pollutes downstream BI dashboards.

models:
  - name: stg_customer_reviews
    description: "Staged raw reviews from Cymbal Pets."
    columns:
      - name: review_id
        description: "Primary key for each review record."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null
      - name: product_id
        description: "Product identifier."
        tests:
          - not_null
      - name: review_text
        description: "Raw unstructured review text."
        tests:
          - not_null
      - name: review_date
        description: "Submission timestamp."
        tests:
          - not_null

  - name: int_reviews_enriched
    description: "Intermediate model containing text enriched via BigQuery AI functions with capped retries & DLQ handling."
    columns:
      - name: review_id
        description: "Unique identifier for the review."
        tests:
          - unique
          - not_null

      - name: product_sentiment_score
        description: "Aspect Sentiment 1: Numeric rating (1-5) for product quality, performance, and features via BigQuery AI.SCORE."

      - name: shipping_sentiment_score
        description: "Aspect Sentiment 2: Numeric rating (1-5) for shipping, delivery speed, and packaging via BigQuery AI.SCORE."

      - name: customer_service_sentiment_score
        description: "Aspect Sentiment 3: Numeric rating (1-5) for customer service, support responsiveness, and return handling via BigQuery AI.SCORE."

      - name: sentiment_score
        description: "Overall Numeric Sentiment Score (1-5) assigned by BigQuery AI.SCORE."

      - name: review_summary
        description: "One-sentence review summary generated by BigQuery AI.GENERATE (with status inspection)."
        tests:
          - not_null

      - name: ai_retry_count
        description: "Retry counter capping LLM retries at max 3 attempts to prevent infinite retry loops."
        tests:
          - not_null

      - name: ai_generation_status
        description: "Observability status tracking (SUCCESS, FAILED_PENDING_RETRY, MAX_RETRIES_EXCEEDED)."
        tests:
          - not_null

  - name: fct_customer_insights
    description: "Mart model aggregating reviews per product with 3 aspect-based sentiment averages and AI semantic summaries."
    columns:
      - name: product_id
        description: "Product identifier."
        tests:
          - not_null
      - name: total_reviews
        description: "Total review count per product."
        tests:
          - not_null
      - name: avg_overall_sentiment_score
        description: "Average overall customer sentiment score across reviews (1.0 - 5.0)."
      - name: avg_product_sentiment_score
        description: "Average product quality sentiment score across reviews (1.0 - 5.0)."
      - name: avg_shipping_sentiment_score
        description: "Average shipping & delivery sentiment score across reviews (1.0 - 5.0)."
      - name: avg_customer_service_sentiment_score
        description: "Average customer service sentiment score across reviews (1.0 - 5.0)."
      - name: product_improvement_recommendations
        description: "Synthesized product improvement recommendations and feature requests per product generated by BigQuery AI.AGG."
        tests:
          - not_null
