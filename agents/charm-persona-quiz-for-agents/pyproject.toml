[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charm"
version = "0.1.0"
description = "Agent OCEAN Personality Profiler powered by Google Gemini Decision 1 (gemini-decision-1) System One Decision Model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["charm_gemini*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

