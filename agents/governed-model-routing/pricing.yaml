# Prices in USD per 1M tokens on Gemini Enterprise Agent Platform: global endpoint, Standard tier.
# Source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Checked on 2026-10-14. Prices change; re-check before publishing numbers.
#
# Keys in a price block:
#   input        uncached input tokens
#   cache_read   cached input tokens (Gemini implicit cache hits, Claude cache hits)
#   cache_write  Claude 5-minute cache writes (Gemini implicit caching has no write charge)
#   output       response + reasoning ("thinking") tokens
#   long_context_threshold + *_long keys: rates applied to every token of a request whose
#   prompt is at or above the threshold.
# "current" applies until its "until" date (launch promotions, introductory prices);
# "list" applies afterwards, and always when a model has no "current" block.
# "levels" are the accepted values for MODEL_ID:LEVEL
# (Gemini thinking_level, Claude effort). An empty list means "model default only".

as_of: "2026-10-14"
source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing

models:
