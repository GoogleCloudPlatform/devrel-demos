  gemini-4-argon:
    levels: [low, medium, high]
    current: {until: "2026-11-30", input: 2.00, cache_read: 0.10, output: 10.00}  # launch promo (50% credit back)
    list: {input: 4.00, cache_read: 0.20, output: 20.00}
