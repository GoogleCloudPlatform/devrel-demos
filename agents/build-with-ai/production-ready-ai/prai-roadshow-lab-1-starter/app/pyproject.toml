[project]
name = "course-creation-app"
version = "0.1.0"
description = "Course Creation Web App"
requires-python = ">=3.11,<3.14"
dependencies = [
    "uvicorn>=0.40.0,<1.0.0",
    "fastapi>=0.133.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "httpx_sse>=0.4.0,<1.0.0",
    "google-genai>=2.34.0,<4.0.0",
    "google-cloud-logging>=3.13.0,<4.0.0",
    "opentelemetry-exporter-gcp-trace>=1.11.0,<2.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
