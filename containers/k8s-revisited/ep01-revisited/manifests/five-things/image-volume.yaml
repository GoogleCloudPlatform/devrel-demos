# Image volume (GA in 1.36): mount an OCI artifact read-only, for example model weights.
# The artifact is the one the Kubernetes "Use an Image Volume With a Pod" task page uses.
apiVersion: v1
kind: Pod
metadata:
  name: image-volume-demo
  labels: {k8s-revisited/demo: image-volume}
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "ls -la /models; sleep infinity"]
    volumeMounts:
    - {name: weights, mountPath: /models, readOnly: true}
  volumes:
  - name: weights
    image:
      reference: quay.io/crio/artifact:v2
      pullPolicy: IfNotPresent
