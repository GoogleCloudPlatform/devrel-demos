# User namespaces (GA in 1.36): root in the container maps to an unprivileged user on the node.
apiVersion: v1
kind: Pod
metadata:
  name: userns-demo
  labels: {k8s-revisited/demo: userns}
spec:
  hostUsers: false
  containers:
  - name: shell
    image: debian:12
    command: ["sh", "-c", "cat /proc/self/uid_map; sleep infinity"]
