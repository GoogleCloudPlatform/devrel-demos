# Swap (GA in Kubernetes 1.34). With LimitedSwap, only Burstable Pods can use swap, and a
# container's swap allowance grows with its memory request. On GKE, swap is a node pool
# setting (infra/system-config/swap.yaml).
#
# Both Pods run the same container: it touches about 1200 MiB with a 1 GiB limit.
#   swap-demo     lands on the swap pool (it tolerates the pool's taint) and should keep running.
#   swap-contrast lands on a pool without swap and should be OOMKilled.
apiVersion: v1
kind: Pod
metadata:
  name: swap-demo
  labels: {k8s-revisited/demo: swap}
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: swap
  tolerations:
  - {key: gke-swap, operator: Equal, value: enabled, effect: NoSchedule}
  containers:
  - name: memhog
    image: python:3.13-slim
    command: ["python3", "-c", "import time; b = bytearray(1200 * 1024 * 1024); b[::4096] = b'x' * len(b[::4096]); print('allocated', flush=True); time.sleep(3600)"]
    resources:
      requests: {memory: 512Mi}
      limits: {memory: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: swap-contrast
  labels: {k8s-revisited/demo: swap-contrast}
spec:
  restartPolicy: Never
  containers:
  - name: memhog
    image: python:3.13-slim
    command: ["python3", "-c", "import time; b = bytearray(1200 * 1024 * 1024); b[::4096] = b'x' * len(b[::4096]); print('allocated', flush=True); time.sleep(3600)"]
    resources:
      requests: {memory: 512Mi}
      limits: {memory: 1Gi}
