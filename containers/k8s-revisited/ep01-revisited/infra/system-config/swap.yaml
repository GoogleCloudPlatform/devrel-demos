# Node system config for the Ep1 swap node pool (GKE Standard, 1.34.1-gke.1341000 or later).
# Swap lives on the boot disk and GKE encrypts it by default. On a boot disk, swap can use
# at most half of the disk. Only Burstable Pods can use swap.
# See "Configure nodes to use disk space as virtual memory" in the GKE docs.
linuxConfig:
  swapConfig:
    enabled: true
    bootDiskProfile:
      swapSizePercent: 20
