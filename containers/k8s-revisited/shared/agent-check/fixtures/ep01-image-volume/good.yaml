apiVersion: v1
kind: Pod
metadata:
  name: weights-demo
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "ls /models; sleep infinity"]
    volumeMounts: [{name: weights, mountPath: /models, readOnly: true}]
  volumes:
  - name: weights
    image:
      reference: quay.io/crio/artifact:v2
      pullPolicy: IfNotPresent
