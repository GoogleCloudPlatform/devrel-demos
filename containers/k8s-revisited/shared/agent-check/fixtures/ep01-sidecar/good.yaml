apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: log-demo}
  template:
    metadata:
      labels: {app: log-demo}
    spec:
      initContainers:
      - name: log-shipper
        image: busybox:1.37
        restartPolicy: Always
        command: ["sh", "-c", "touch /var/log/app/app.log; tail -F /var/log/app/app.log"]
        volumeMounts: [{name: logs, mountPath: /var/log/app}]
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "while true; do date >> /var/log/app/app.log; sleep 5; done"]
        volumeMounts: [{name: logs, mountPath: /var/log/app}]
      volumes: [{name: logs, emptyDir: {}}]
